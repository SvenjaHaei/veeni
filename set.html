<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Handmade gift sets from Prague. Small things. Good feelings.">
  <meta property="og:type" content="website">

  <meta property="og:description" content="Handmade gift sets from Prague. Small things. Good feelings.">

</head>
<body data-page="shop" data-title="title.set">
  <main class="wrap">
    <div id="set">
      <a class="set-back label" href="index.html">← <span data-t="set.back"></span></a>
      <div class="set-layout">
        <div class="set-photos" id="set-photos"><div class="photo set-photo-main" id="set-photo-main"></div></div>
        <div class="set-info" id="set-info"></div>
      </div>
    </div>
    <script>
      // Show the photo clicked on the shop page straight away, so it can glide into this spot.
      try {
        var hero = JSON.parse(sessionStorage.getItem("veeni-hero") || "null");
        if (hero && hero.src && hero.id === new URLSearchParams(location.search).get("id")) {
          var heroImg = document.createElement("img");
          heroImg.src = hero.src;
          heroImg.alt = "";
          document.getElementById("set-photo-main").appendChild(heroImg);
        }
      } catch (e) {}
    </script>
  </main>

  <script src="assets/config.js?v=116"></script>
  <script src="assets/i18n.js?v=116"></script>
  <script src="assets/site.js?v=116"></script>
  <script src="assets/shop.js?v=116"></script>
</body>
</html>
