<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · veeni</title>
  <meta name="description" content="Handmade gift sets from Prague. Small things. Good feelings.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="veeni">
  <meta property="og:title" content="veeni · Handmade in Prague">
  <meta property="og:description" content="Handmade gift sets from Prague. Small things. Good feelings.">
  <meta property="og:image" content="https://veeni.cz/images/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="images/favicon-plum.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css?v=122">
</head>
<body data-page="checkout" data-title="title.checkout">
  <main class="wrap">
    <div class="page-head">
      <h1 data-t="checkout.title"></h1>
      <p class="muted" id="checkout-lead"></p>
    </div>
    <form class="checkout-layout" id="checkout-form" novalidate>
      <div>
        <h2 class="label" data-t="checkout.details"></h2>
        <div class="fields">
          <div class="field"><label class="label" for="firstName" data-t="checkout.firstName"></label><input id="firstName" name="firstName" autocomplete="given-name" required></div>
          <div class="field"><label class="label" for="lastName" data-t="checkout.lastName"></label><input id="lastName" name="lastName" autocomplete="family-name" required></div>
          <div class="field"><label class="label" for="email" data-t="checkout.email"></label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label class="label" for="phone" data-t="checkout.phone"></label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div>
          <div class="field full delivery-field"><label class="label" for="street" data-t="checkout.street"></label><input id="street" name="street" autocomplete="street-address" required></div>
          <div class="field delivery-field"><label class="label" for="city" data-t="checkout.city"></label><input id="city" name="city" autocomplete="address-level2" required></div>
          <div class="field delivery-field"><label class="label" for="zip" data-t="checkout.zip"></label><input id="zip" name="zip" autocomplete="postal-code" inputmode="numeric" required></div>
        </div>
        <label class="check"><input type="checkbox" name="termsConsent" required><span id="terms-consent"></span></label>
        <label class="check"><input type="checkbox" name="privacyConsent" required><span id="privacy-consent"></span></label>
        <p class="form-error" id="checkout-error" role="alert"></p>
      </div>
      <aside class="summary">
        <h2 class="label" data-t="checkout.summary"></h2>
        <div id="checkout-lines"></div>
        <div id="checkout-totals"></div>
        <button type="submit" class="button block" id="checkout-submit" data-t="checkout.place"></button>
      </aside>
    </form>
  </main>

  <script src="assets/config.js?v=122"></script>
  <script src="assets/i18n.js?v=122"></script>
  <script src="assets/site.js?v=122"></script>
  <script src="assets/checkout.js?v=122"></script>
</body>
</html>
